<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEATCARE | Create Hospital Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-card">

            <div class="hospital-logo">✚</div>

            <h1>Create Hospital Account</h1>
            <p>Register your hospital with HEATCARE</p>

            <form id="hospitalRegisterForm">

                <div class="form-group">
                    <label for="hospitalName">Hospital Name</label>
                    <input type="text" id="hospitalName"
                        placeholder="Enter hospital name" required>
                </div>

                <div class="form-group">
                    <label for="registrationNumber">Hospital Registration Number</label>
                    <input type="text" id="registrationNumber"
                        placeholder="Enter registration number" required>
                </div>

                <div class="form-group">
                    <label for="hospitalAddress">Hospital Address</label>
                    <textarea id="hospitalAddress"
                        placeholder="Enter hospital address"
                        rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="adminName">Administrator Name</label>
                    <input type="text" id="adminName"
                        placeholder="Enter administrator name" required>
                </div>

                <div class="form-group">
                    <label for="hospitalEmail">Official Email Address</label>
                    <input type="email" id="hospitalEmail"
                        placeholder="Enter official email" required>
                </div>

                <div class="form-group">
                    <label for="hospitalPhone">Contact Number</label>
                    <input type="tel" id="hospitalPhone"
                        placeholder="Enter contact number" required>
                </div>

                <!-- Create Password -->
                <div class="form-group">
                    <label for="hospitalPassword">Create Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="hospitalPassword"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-password-target="hospitalPassword"
                            aria-label="Show password"
                        >👁</button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-password-target="confirmPassword"
                            aria-label="Show password"
                        >👁</button>
                    </div>
                </div>

                <button type="submit" class="primary-button">
                    Create Hospital Account
                </button>

                <p id="registerMessage" role="status" aria-live="polite"></p>

            </form>

            <p class="login-footer">
                Already registered?
                <a href="login.html">Login here</a>
            </p>

        </div>
    </div>

    <script src="./auth.js"></script>
</body>
</html>
