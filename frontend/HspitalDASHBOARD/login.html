
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HEATCARE | Hospital Login</title>

    <!-- Load CSS from the same folder -->
    <link rel="stylesheet" href="./style.css">

    <!-- Prevent browser from using an old cached stylesheet -->
    <meta name="theme-color" content="#19804b">
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-card">

            <!-- Hospital Logo -->
            <div class="hospital-logo" aria-hidden="true">✚</div>

            <h1>Hospital Login</h1>
            <p>Sign in to your HEATCARE account</p>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="hospitalId">Hospital ID or Registered Email</label>
                    <input
                        type="text"
                        id="hospitalId"
                        name="hospitalId"
                        placeholder="Enter your Hospital ID or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-controls="password"
                        >👁</button>
                    </div>
                </div>

                <button type="submit" class="primary-button">
                    Login
                </button>

                <p id="loginMessage" role="status" aria-live="polite"></p>
            </form>

            <!-- Navigation Links -->
            <p class="login-footer">
                New hospital?
                <a href="./register.html">Create Hospital Account</a>
            </p>

            <p class="login-footer">
                <a href="./index.html">← Back to Home</a>
            </p>

        </div>
    </div>

    <!-- Load JavaScript once -->
    <script src="./auth.js"></script>
</body>
</html>
